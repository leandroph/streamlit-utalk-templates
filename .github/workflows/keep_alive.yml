name: Keep Streamlit Alive

on:
  schedule:
    - cron: "0 */2 * * *" # Roda a cada 2 horas (você pode ajustar)
  workflow_dispatch: # Permite rodar manualmente se quiser

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping URL
        run: |
          curl -I https://appgigio.streamlit.app/